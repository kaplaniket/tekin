name: Ladestopp-Daten aktualisieren
on:
  schedule:
    - cron: "17 4 3 * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
      - name: Ladesäulenregister laden und Kacheln bauen
        working-directory: ladestopp
        run: |
          URL=$(curl -sL -A "Mozilla/5.0" https://www.bundesnetzagentur.de/ladeinfrastruktur | grep -oE 'https://data\.bundesnetzagentur\.de/[^"]*Ladesaeulenregister[^"]*\.csv' | head -1)
          test -n "$URL"
          curl -sL -A "Mozilla/5.0" -o data/register.csv "$URL"
          test $(stat -c %s data/register.csv) -gt 10000000
          python3 build_data.py
          python3 make_tiles.py
          rm -f data/register.csv data/stations.json
      - name: Speichern
        run: |
          git config user.name "ladestopp-bot"
          git config user.email "ladestopp-bot@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || (git commit -m "Ladesäulen-Daten aktualisiert" && git push)
